<!-- ═══════ exam.html — ระบบทำข้อสอบ + กดส่ง → สรุปผล/เฉลยพร้อมคำอธิบาย ═══════ -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทำข้อสอบ — เตรียมสอบ ก.พ.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="navbar-inner">
  <a href="dashboard.html" class="navbar-brand"><span class="brand-icon">ก.พ.</span> <span id="exam-title">ทำข้อสอบ</span></a>
  <div class="navbar-nav flex items-center gap-2">
    <span class="timer text-secondary" id="timer">00:00</span>
    <button class="btn btn-outline btn-sm" id="quit-btn">ออก</button>
  </div>
</div></nav>

<main class="container" style="padding:1.5rem 1.25rem 4rem;">
  <div id="loading" class="card card-pad text-center text-secondary">กำลังเตรียมชุดข้อสอบ...</div>

  <!-- ── โหมดทำข้อสอบ ── -->
  <div id="quiz" class="hidden">
    <div class="progress-track mb-3"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="grid-2" style="grid-template-columns:1fr 260px;align-items:start;">
      <div>
        <div class="card card-pad">
          <div class="flex gap-1 mb-2" style="flex-wrap:wrap;">
            <span class="badge badge-muted" id="q-index"></span>
            <span class="badge badge-primary" id="q-subject"></span>
            <span class="badge badge-gold" id="q-diff"></span>
          </div>
          <p id="q-text" style="font-size:1.05rem;line-height:1.9;white-space:pre-wrap;" class="mb-3"></p>
          <div id="q-choices"></div>
        </div>
        <div class="flex justify-between gap-2 mt-3">
          <button class="btn btn-outline" id="prev-btn">ย้อนกลับ</button>
          <div class="flex gap-2">
            <button class="btn btn-ghost" id="clear-btn">ล้างคำตอบ</button>
            <button class="btn btn-primary" id="next-btn">ข้อถัดไป</button>
            <button class="btn btn-gold hidden" id="submit-btn">ส่งคำตอบ</button>
          </div>
        </div>
      </div>
      <aside class="card card-pad">
        <h3 class="text-sm mb-2">แผนผังข้อสอบ</h3>
        <div class="qnav" id="qnav"></div>
        <p class="text-muted text-xs mt-2" id="answered-count"></p>
        <button class="btn btn-gold btn-block mt-2" id="submit-side">ส่งคำตอบทั้งหมด</button>
      </aside>
    </div>
  </div>

  <!-- ── หน้าสรุปผล + เฉลย ── -->
  <div id="result" class="hidden">
    <div class="card card-pad text-center mb-4 fade-up">
      <div class="level-badge mb-2" id="r-verdict"></div>
      <h1 class="mb-1"><span id="r-score"></span><span class="text-muted" style="font-size:1.4rem;">%</span></h1>
      <p class="text-secondary" id="r-detail"></p>
      <div class="grid-4 mt-3">
        <div><div class="font-display text-lg" id="r-correct">0</div><div class="text-muted text-xs">ตอบถูก</div></div>
        <div><div class="font-display text-lg" id="r-wrong">0</div><div class="text-muted text-xs">ตอบผิด</div></div>
        <div><div class="font-display text-lg" id="r-exp">0</div><div class="text-muted text-xs">EXP ที่ได้</div></div>
        <div><div class="font-display text-lg" id="r-time">00:00</div><div class="text-muted text-xs">เวลาที่ใช้</div></div>
      </div>
      <div class="flex justify-center gap-2 mt-3" style="flex-wrap:wrap;">
        <a href="dashboard.html" class="btn btn-primary">กลับแดชบอร์ด</a>
        <button class="btn btn-outline" id="retry-btn">ทำชุดใหม่</button>
      </div>
    </div>

    <h3 class="mb-2">สรุปผลรายหัวเรื่อง</h3>
    <div class="card mb-4" style="overflow-x:auto;">
      <table class="table"><thead><tr><th>หัวเรื่อง</th><th>ถูก</th><th>ทั้งหมด</th><th>ความแม่นยำ</th></tr></thead>
      <tbody id="r-bytopic"></tbody></table>
    </div>

    <div class="flex justify-between items-center mb-2" style="flex-wrap:wrap;gap:.5rem;">
      <h3>เฉลยพร้อมคำอธิบายรายข้อ</h3>
      <div class="flex gap-1">
        <button class="btn btn-sm btn-outline" data-filter="all">ทั้งหมด</button>
        <button class="btn btn-sm btn-outline" data-filter="wrong">เฉพาะข้อที่ผิด</button>
      </div>
    </div>
    <div id="r-review" class="flex flex-col gap-2"></div>
  </div>
</main>

<script type="module" src="js/exam.js"></script>
</body>
</html>
