<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://wefgreavazpfctayjnmp.supabase.co;" />
  <title>สมัครสมาชิก — เตรียมสอบ ก.พ.</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="theme-light">
  <div class="login-split">
    <section class="login-form-side">
      <div id="signup-wrap" class="login-form-wrap fade-up" style="visibility:hidden;">

        <a href="index.html" class="login-brand">
          <span class="login-brand-icon">⚔️</span>
          <span class="login-brand-text">เตรียมสอบ <span>ก.พ.</span></span>
        </a>

        <div class="login-heading">
          <h1>สร้างบัญชีใหม่ ✨</h1>
          <p>เริ่มฝึกทำข้อสอบและติดตามความก้าวหน้าได้ทันที</p>
        </div>

        <div id="error-banner-1" class="login-error hidden"></div>

        <form id="signup-form-step1" class="login-form">
          <div class="login-field">
            <label for="signup-name" class="login-label">ชื่อที่แสดง</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">👤</span>
              <input type="text" id="signup-name" required maxlength="100" class="login-input" placeholder="เช่น วีรพล" />
            </div>
          </div>

          <div class="login-field">
            <label for="signup-email" class="login-label">อีเมล</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">✉️</span>
              <input type="email" id="signup-email" required autocomplete="email" class="login-input" placeholder="you@example.com" />
            </div>
          </div>

          <div class="login-field">
            <label for="signup-password" class="login-label">รหัสผ่าน</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">🔒</span>
              <input type="password" id="signup-password" required autocomplete="new-password" class="login-input" placeholder="••••••••" style="padding-right:3rem;" />
              <button type="button" class="login-input-toggle toggle-pw" data-target="signup-password" aria-label="แสดง/ซ่อนรหัสผ่าน">👁️</button>
            </div>
          </div>

          <div class="login-field">
            <label for="signup-password-confirm" class="login-label">ยืนยันรหัสผ่าน</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">🔒</span>
              <input type="password" id="signup-password-confirm" required autocomplete="new-password" class="login-input" placeholder="••••••••" style="padding-right:3rem;" />
              <button type="button" class="login-input-toggle toggle-pw" data-target="signup-password-confirm" aria-label="แสดง/ซ่อนรหัสผ่าน">👁️</button>
            </div>
          </div>

          <div id="pw-strength" class="hidden" style="margin-top:0.5rem; margin-bottom:0.5rem;">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs text-secondary">ความแรงของรหัสผ่าน</span>
              <span id="pw-strength-text" class="text-xs" style="font-weight:700;"> </span>
            </div>
            <div class="pw-strength-bar-wrap">
              <span class="pw-strength-bar"></span>
              <span class="pw-strength-bar"></span>
              <span class="pw-strength-bar"></span>
              <span class="pw-strength-bar"></span>
            </div>
          </div>

          <div id="pw-match-hint" class="hidden" style="margin-top:0.35rem; margin-bottom:0.5rem; font-size:0.8rem; font-weight:700;"></div>

          <label class="checkbox-row" style="margin-top:0.5rem; margin-bottom:1rem;">
            <input id="signup-agree-checkbox" type="checkbox" />
            <span>ฉันยอมรับเงื่อนไขการใช้งานและนโยบายความเป็นส่วนตัว</span>
          </label>

          <button id="signup-step1-btn" type="submit" class="login-submit-btn">
            <span class="login-submit-text">ดำเนินการต่อ</span>
            <span class="login-submit-spinner hidden"></span>
          </button>
        </form>

        <div id="signup-step-2" class="hidden">
          <div id="error-banner-2" class="login-error hidden"></div>

          <div class="card" style="padding:1rem; margin-top:1rem; background:rgba(255,255,255,0.04); border:1px solid var(--border-subtle);">
            <p class="text-secondary text-xs mb-2">ตรวจสอบข้อมูล</p>
            <div class="mb-1"><strong>ชื่อ:</strong> <span id="confirm-name"></span></div>
            <div><strong>อีเมล:</strong> <span id="confirm-email"></span></div>
          </div>

          <div class="login-actions-row" style="margin-top:1rem;">
            <button id="signup-back-btn" type="button" class="btn btn-ghost btn-full">กลับ</button>
            <button id="signup-confirm-btn" type="button" class="login-submit-btn">
              <span class="login-submit-text">✅ ยืนยันสมัครสมาชิก</span>
              <span class="login-submit-spinner hidden"></span>
            </button>
          </div>
        </div>

        <p class="login-signup" style="margin-top:1rem;">
          มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
        </p>
      </div>
    </section>

    <aside class="login-showcase-side" id="showcase-root"></aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/showcase.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
