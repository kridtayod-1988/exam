<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.anthropic.com https://generativelanguage.googleapis.com; frame-src https://*.supabase.co;">
  <title>ลืมรหัสผ่าน — เตรียมสอบ ก.พ.</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem;">

  <div class="container-sm fade-up">
    <div class="text-center mb-3">
      <a href="index.html" class="navbar-brand" style="justify-content:center;display:inline-flex;">
        <span class="brand-icon">⚔️</span>
        เตรียมสอบ <span class="brand-accent">ก.พ.</span>
      </a>
    </div>

    <div class="card" style="padding:2rem;">
      <h1 class="text-center mb-1" style="font-size:1.5rem;">ลืมรหัสผ่าน</h1>
      <p class="text-center text-sm text-secondary mb-3">กรอกอีเมลที่ใช้สมัครสมาชิก ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>

      <div id="error-banner" class="form-error hidden"></div>
      <div id="success-banner" class="form-success hidden"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email" class="form-label">อีเมล</label>
          <input type="email" id="forgot-email" required class="form-input" placeholder="you@example.com">
        </div>
        <button type="submit" id="forgot-submit-btn" class="btn btn-gold btn-full btn-lg">
          ส่งลิงก์รีเซ็ตรหัสผ่าน
        </button>
      </form>

      <p class="text-center text-sm mt-3">
        <a href="login.html">← กลับไปหน้าเข้าสู่ระบบ</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
