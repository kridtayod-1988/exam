<!-- ═══════════════════════ login.html ═══════════════════════ -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — เตรียมสอบ ก.พ.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="navbar-inner">
  <a href="index.html" class="navbar-brand"><span class="brand-icon">ก.พ.</span> เตรียมสอบ <span class="brand-accent">ก.พ.</span></a>
  <div class="navbar-nav"><a href="signup.html" class="btn btn-outline btn-sm">สมัครสมาชิก</a></div>
</div></nav>

<main class="container-sm" style="padding:3.5rem 1.25rem;">
  <div class="card card-pad fade-up">
    <h2 class="text-center mb-1">เข้าสู่ระบบ</h2>
    <p class="text-secondary text-sm text-center mb-3">กลับมาทำภารกิจต่อจากที่ค้างไว้</p>

    <div id="alert" class="alert alert-error mb-2 hidden"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">อีเมล</label>
        <input class="form-input" type="email" id="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">รหัสผ่าน</label>
        <input class="form-input" type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="submit-btn" type="submit">เข้าสู่ระบบ</button>
    </form>

    <p class="text-center text-sm text-secondary mt-3">
      ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิกฟรี</a>
    </p>
    <p class="text-center text-sm mt-1">
      <a href="#" id="reset-link" class="text-muted">ลืมรหัสผ่าน</a>
    </p>
  </div>
</main>

<script type="module">
import { sb } from './js/config.js';

const form = document.getElementById('login-form');
const alertBox = document.getElementById('alert');
const btn = document.getElementById('submit-btn');
const show = m => { alertBox.textContent = m; alertBox.classList.remove('hidden'); };

const params = new URLSearchParams(location.search);
if (params.get('banned')) show('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');
if (params.get('registered')) {
  alertBox.className = 'alert alert-success mb-2';
  show('สมัครสมาชิกสำเร็จ กรุณายืนยันอีเมลแล้วเข้าสู่ระบบ');
}

// ถ้ามี session อยู่แล้วให้ข้ามไปแดชบอร์ด
sb.auth.getSession().then(({data}) => { if (data.session) location.replace('dashboard.html'); });

form.addEventListener('submit', async e => {
  e.preventDefault();
  alertBox.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('password').value
  });
  if (error){
    alertBox.className = 'alert alert-error mb-2';
    show(error.message.includes('Invalid') ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message);
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    return;
  }
  location.href = new URLSearchParams(location.search).get('next') || 'dashboard.html';
});

document.getElementById('reset-link').addEventListener('click', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return show('กรุณากรอกอีเมลก่อนกดลืมรหัสผ่าน');
  const { error } = await sb.auth.resetPasswordForEmail(email,
    { redirectTo: location.origin + '/login.html' });
  alertBox.className = error ? 'alert alert-error mb-2' : 'alert alert-success mb-2';
  show(error ? error.message : 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยังอีเมลแล้ว');
});
</script>
</body>
</html>
