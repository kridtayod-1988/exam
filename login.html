<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.anthropic.com https://generativelanguage.googleapis.com; frame-src https://*.supabase.co;">
  <title>เข้าสู่ระบบ — เตรียมสอบ ก.พ.</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-light">

  <div class="login-split">

    <!-- ═══ LEFT: Login Form ═══ -->
    <section class="login-form-side">
      <div id="login-wrap" class="login-form-wrap fade-up" style="visibility:hidden;">

        <a href="index.html" class="login-brand">
          <span class="login-brand-icon">⚔️</span>
          <span class="login-brand-text">เตรียมสอบ <span>ก.พ.</span></span>
        </a>

        <div class="login-heading">
          <h1>ยินดีต้อนรับกลับมา 👋</h1>
          <p>เข้าสู่ระบบเพื่อทำข้อสอบต่อจากที่ค้างไว้</p>
        </div>

        <div id="error-banner" class="login-error hidden"></div>

        <form id="login-form" class="login-form">
          <div class="login-field">
            <label for="login-email" class="login-label">อีเมล</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">✉️</span>
              <input type="email" id="login-email" required autocomplete="email" class="login-input" placeholder="you@example.com">
            </div>
          </div>

          <div class="login-field">
            <div class="login-label-row">
              <label for="login-password" class="login-label">รหัสผ่าน</label>
              <a href="forgot-password.html" class="login-forgot">ลืมรหัสผ่าน?</a>
            </div>
            <div class="login-input-wrap">
              <span class="login-input-icon">🔒</span>
              <input type="password" id="login-password" required autocomplete="current-password" class="login-input" placeholder="••••••••" style="padding-right:3rem;">
              <button type="button" id="toggle-password-btn" class="login-input-toggle" aria-label="แสดง/ซ่อนรหัสผ่าน">👁️</button>
            </div>
          </div>

          <button type="submit" id="login-submit-btn" class="login-submit-btn">
            <span class="login-submit-text">เข้าสู่ระบบ</span>
            <span class="login-submit-spinner hidden"></span>
          </button>
        </form>

        <div class="login-divider">
          <span>หรือ</span>
        </div>

        <button id="google-signin-btn" type="button" class="login-google-btn">
          <svg style="width:20px;height:20px;flex-shrink:0;" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          <span>เข้าสู่ระบบด้วย Google</span>
        </button>

        <p class="login-signup">
          ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิกฟรี</a>
        </p>
      </div>
    </section>

    <!-- ═══ RIGHT: Showcase (injected by showcase.js) ═══ -->
    <aside class="login-showcase-side" id="showcase-root"></aside>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/showcase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
