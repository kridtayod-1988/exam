<!-- signup.html -->
<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก — เตรียมสอบ ก.พ.</title>
<link rel="stylesheet" href="css/style.css"></head>
<body style="background:var(--bg-soft);min-height:100vh;display:grid;place-items:center;padding:1.5rem;">
  <div style="width:100%;max-width:440px;">
    <div class="text-center mb-3">
      <a href="index.html" class="navbar-brand" style="justify-content:center;font-size:1.3rem;">
        <span>⚔️</span> เตรียมสอบ <span class="brand-accent">ก.พ.</span></a>
      <p class="text-secondary text-sm mt-2">สมัครฟรี เริ่มสะสม EXP ภายใน 1 นาที</p>
    </div>

    <div class="card card-flat" id="signup-card" style="padding:1.75rem;">
      <h2 style="font-size:1.35rem;" class="mb-3">สร้างบัญชีใหม่</h2>
      <div id="form-error" class="error-text mb-2 hidden"></div>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="display_name">ชื่อที่ใช้แสดง</label>
          <input id="display_name" name="display_name" class="input" required maxlength="40" placeholder="เช่น น้องเตรียมสอบ">
        </div>
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" class="input" required autocomplete="email" placeholder="you@example.com">
          <span class="help">ใช้สำหรับยืนยันตัวตนและกู้คืนรหัสผ่าน</span>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" class="input" required minlength="8" autocomplete="new-password">
          <div class="progress" style="margin-top:.35rem;"><span id="pw-bar" style="width:0"></span></div>
          <span class="help">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</span>
        </div>
        <div class="field">
          <label for="password2">ยืนยันรหัสผ่าน</label>
          <input id="password2" name="password2" type="password" class="input" required autocomplete="new-password">
        </div>
        <label class="text-sm text-secondary flex items-start gap-1 mb-3" style="font-weight:400;">
          <input type="checkbox" name="accept" style="margin-top:.35rem;">
          <span>ฉันยอมรับ <a href="terms.html">เงื่อนไขการใช้งาน</a> และ <a href="privacy.html">นโยบายความเป็นส่วนตัว</a></span>
        </label>
        <button type="submit" class="btn btn-gold btn-block btn-lg">สมัครสมาชิก</button>
      </form>
      <p class="text-center text-sm text-secondary mt-3">มีบัญชีแล้ว? <a href="login.html"><strong>เข้าสู่ระบบ</strong></a></p>
    </div>

    <div class="card card-flat hidden text-center" id="signup-done" style="padding:2.5rem 1.75rem;">
      <div style="font-size:2.5rem;">📧</div>
      <h2 style="font-size:1.25rem;" class="mb-2 mt-2">ตรวจอีเมลของคุณ</h2>
      <p class="text-secondary text-sm mb-3">เราส่งลิงก์ยืนยันไปให้แล้ว กดยืนยันเพื่อเปิดใช้งานบัญชี</p>
      <a href="login.html" class="btn btn-outline btn-block">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body></html>
