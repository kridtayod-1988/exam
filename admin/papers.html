<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src https://*.supabase.co;">
  <title>จัดการชุดข้อสอบ — เตรียมสอบ ก.พ.</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:1rem;">
        <div>
          <h1 class="mb-1">📚 จัดการชุดข้อสอบ</h1>
          <p class="text-secondary">ชุดข้อสอบย้อนหลังที่นำเข้าหรือสร้างไว้</p>
        </div>
        <a href="import-questions.html" class="btn btn-gold">+ นำเข้าชุดใหม่</a>
      </div>

      <div class="card mb-3" style="padding:1rem; display:flex; gap:0.75rem; flex-wrap:wrap;">
        <input type="text" id="paper-search" placeholder="ค้นหา code หรือชื่อ..." class="form-input" style="flex:1; min-width:200px;">
        <select id="paper-year-filter" class="form-select" style="width:auto;">
          <option value="">ทุกปี</option>
        </select>
        <select id="paper-status-filter" class="form-select" style="width:auto;">
          <option value="">ทุกสถานะ</option>
          <option value="active">เปิดใช้งาน</option>
          <option value="inactive">ปิดใช้งาน</option>
        </select>
      </div>

      <div class="card" style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>ชื่อชุด</th>
              <th>ปี</th>
              <th>คำถาม</th>
              <th>สถานะ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="papers-table-body">
            <tr><td colspan="6" class="text-center text-muted" style="padding:2rem;">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="papers-count-info" class="text-sm text-muted mt-2"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/admin/admin-layout.js"></script>
  <script src="../js/admin/papers.js"></script>
</body>
</html>
