# .github/workflows/ci.yml
# เพิ่มเข้าไปคู่กับ deploy.yml เดิมที่ท่านมีอยู่ ไม่ต้องแก้ไฟล์เดิม
name: CI — Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ทดสอบชั้นตรรกะ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:cov

  validate-bank:
    name: ตรวจคลังข้อสอบ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: ตรวจข้อซ้ำและเฉลยผิดในไฟล์เนื้อหา
        run: node scripts/validateBankCli.mjs | tee bank-report.txt
      - name: แนบรายงานลงใน Pull Request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bank-report.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: '### รายงานตรวจสอบคลังข้อสอบ\n\n```text\n'
                    + report.slice(0, 55000) + '\n```',
            });

  db-migration:
    name: ตรวจ Migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: testdb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d testdb -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
          for f in supabase/migrations/*.sql; do
            echo "รัน $f"
            psql -h localhost -U postgres -d testdb -v ON_ERROR_STOP=1 -f "$f"
          done